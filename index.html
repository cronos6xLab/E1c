<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ville du Parfum · Concentrado</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EDE8DC;
            --paper: #FFFEFB;
            --ink: #111111;
            --line: #111111;
            --muted: #6E6E6E;
            --border: 1.5px solid #111111;
            --border-thin: 1px solid #111111;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0!important; }
        body {
            background: var(--bg);
            font-family: 'IBM Plex Mono', 'Courier Prime', monospace;
            color: var(--ink);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.4;
        }
       .announcement-bar {
            background: var(--ink);
            color: var(--bg);
            padding: 10px 0;
            overflow: hidden;
            position: sticky;
            top: 0;
            z-index: 102;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-weight: 500;
            border-bottom: var(--border);
        }
       .marquee-track { display: flex; width: max-content; animation: marquee-smooth 32s linear infinite; }
       .announcement-bar:hover .marquee-track { animation-play-state: paused; }
       .marquee-track span { white-space: nowrap; padding: 0 36px; display: inline-flex; align-items: center; gap: 12px; }
       .marquee-sep { color: var(--bg); opacity: 0.5; font-size: 0.6rem; }
        @keyframes marquee-smooth { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
       .header {
            background: var(--bg);
            padding: 20px 18px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 100;
            border-bottom: var(--border);
        }
       .header h1 {
            font-family: 'Courier Prime', monospace;
            color: var(--ink);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
       .stepper-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 0;
            padding: 14px 10px 14px;
            background: var(--bg);
            position: sticky;
            top: 37px;
            z-index: 99;
            border-bottom: var(--border);
        }
       .stepper-col { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 62px; }
       .stepper-dot {
            width: 28px; height: 28px;
            border: 1.5px solid var(--ink);
            background: var(--paper);
            color: var(--ink);
            display: flex; align-items: center; justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem; font-weight: 600;
            transition: all 0.2s ease;
        }
       .stepper-dot.completed { background: var(--ink); color: var(--bg); }
       .stepper-dot.active { background: var(--ink); color: var(--bg); transform: none; box-shadow: none; }
       .stepper-col span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.52rem; letter-spacing: 1px; text-transform: uppercase;
            color: var(--muted); text-align: center; line-height: 1.2; font-weight: 500;
        }
       .stepper-col.completed span { color: var(--ink); font-weight: 600; }
       .stepper-line { width: 22px; height: 1.5px; background: var(--ink); margin-top: 13px; flex-shrink: 0; opacity: 0.2; }
       .stepper-line.done { opacity: 1; }
       .container { max-width: 560px; margin: 0 auto; padding: 0 0 220px; }
       .product-image-wrap {
            position: relative;
            width: calc(100% - 28px);
            margin: 14px 14px 0;
            height: 460px;
            overflow: hidden;
            border: var(--border);
            background: var(--paper);
        }
       .product-image-wrap img {
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: center;
            background: #fff;
            padding: 18px;
        }
       .rating-badge {
            position: absolute;
            bottom: 0; left: 0;
            background: var(--paper);
            border-top: var(--border);
            border-right: var(--border);
            color: var(--ink);
            padding: 7px 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex; align-items: center; gap: 6px;
        }
       .product-info { padding: 18px 14px 8px; text-align: left; border-bottom: var(--border); margin-bottom: 0; background: var(--bg); }
       .product-info h2 {
            font-family: 'Courier Prime', monospace;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink);
            margin-bottom: 4px;
            line-height: 1.1;
        }
       .product-subtitle {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }
       .card {
            background: var(--paper);
            border: var(--border);
            border-top: none;
            box-shadow: none;
            padding: 20px 16px;
            margin-bottom: 0;
        }
       .card:first-of-type { border-top: var(--border); }
       .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: var(--ink);
            margin-bottom: 14px;
            font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }
       .step-badge {
            background: var(--paper);
            color: var(--ink);
            border: 1.5px solid var(--ink);
            width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem; font-weight: 600;
            flex-shrink: 0;
        }
       .step-badge.done { background: var(--ink); color: var(--bg); }
       .size-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            border: var(--border);
        }
       .size-btn {
            padding: 16px 6px;
            border: none;
            border-right: var(--border-thin);
            border-bottom: var(--border-thin);
            background: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.74rem;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
       .size-btn:nth-child(3n) { border-right: none; }
       .size-btn:nth-last-child(-n+3) { border-bottom: none; }
       .size-btn:hover { background: #F2F0E8; }
       .size-btn.active {
            background: var(--ink);
            color: var(--bg);
            box-shadow: none;
            transform: none;
        }
       .size-btn.extra-product {
            font-size: 0.62rem;
            line-height: 1.3;
            padding: 12px 4px;
        }
       .size-btn.extra-product.active { border-color: var(--ink); }
       .price-shimmer {
            text-align: left;
            font-family: 'Courier Prime', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0;
            color: var(--ink);
            margin-top: 14px;
            background: none;
            -webkit-text-fill-color: var(--ink);
        }
       .conc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
            border: var(--border);
        }
       .conc-btn {
            padding: 16px 10px;
            border: none;
            border-right: var(--border-thin);
            border-bottom: var(--border-thin);
            background: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            line-height: 1.4;
            display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
       .conc-btn:nth-child(2n) { border-right: none; }
       .conc-btn:nth-last-child(-n+2) { border-bottom: none; }
       .conc-btn:hover { background: #F2F0E8; }
       .conc-btn.active { background: var(--ink); color: var(--bg); box-shadow: none; transform: none; }
       .conc-dots { display: flex; gap: 4px; }
       .conc-dots span { width: 6px; height: 6px; border: 1px solid var(--ink); background: transparent; }
       .conc-btn.active .conc-dots span { background: var(--bg); border-color: var(--bg); }
       .conc-btn small { display: block; font-size: 0.6rem; opacity: 0.7; font-weight: 400; text-transform: none; letter-spacing: 0; }
       .promo-bento {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border: var(--border);
        }
       .promo-btn {
            padding: 14px 10px;
            background: var(--paper);
            border: none;
            border-right: var(--border-thin);
            border-bottom: var(--border-thin);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            line-height: 1.4;
            text-transform: uppercase;
            opacity: 1;
        }
       .promo-btn:nth-child(2n) { border-right: none; }
       .promo-btn:nth-last-child(-n+2) { border-bottom: none; }
       .promo-btn.active-vol { background: #F2F0E8; }
       .promo-btn.active {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink);
            box-shadow: none;
            transform: none;
        }
       .promo-btn small { display: block; font-size: 0.62rem; opacity: 0.7; margin-top: 3px; font-weight: 400; text-transform: none; }
       .promo-badge-bestseller {
            position: absolute; top: 0; right: 0;
            background: var(--ink);
            color: var(--bg);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 2px 6px;
            font-weight: 600;
            border-left: var(--border-thin);
            border-bottom: var(--border-thin);
        }
       .promo-instruction {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            color: var(--ink);
            background: var(--bg);
            border: var(--border-thin);
            border-left: 3px solid var(--ink);
            padding: 10px 12px;
            margin-bottom: 14px;
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
       .promo-status {
            margin-top: 14px;
            background: var(--bg);
            border: var(--border);
            padding: 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.76rem;
            display: none;
        }
       .promo-status.visible { display: block; }
       .promo-selected-list { margin: 12px 0 4px; display: flex; flex-wrap: wrap; gap: 6px; }
       .promo-chip {
            display: inline-flex; align-items: center;
            background: var(--paper);
            padding: 5px 8px;
            border: var(--border-thin);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            gap: 5px;
            white-space: nowrap;
            text-transform: uppercase;
        }
       .promo-chip-code { font-weight: 700; }
       .promo-chip-name { color: var(--muted); max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
       .promo-chip-qty-btn {
            width: 22px; height: 22px;
            border: var(--border-thin);
            background: var(--paper);
            font-size: 0.7rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--ink);
            font-family: 'IBM Plex Mono', monospace;
        }
       .promo-chip-qty-btn:hover { background: var(--ink); color: var(--bg); }
       .promo-chip-remove { cursor: pointer; color: var(--muted); font-size: 0.85rem; margin-left: 2px; }
       .promo-chip-remove:hover { color: var(--ink); }
       .btn-cancel-promo-inline {
            background: transparent;
            color: var(--ink);
            border: var(--border);
            padding: 10px 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            cursor: pointer; width: 100%; margin-top: 10px;
        }
       .btn-cancel-promo-inline:hover { background: var(--ink); color: var(--bg); }
       .finish-promo-wrapper { display: none; margin-top: 12px; }
       .finish-promo-wrapper.visible { display: block; }
       .btn-finish-promo {
            background: var(--ink); color: var(--bg);
            border: var(--border);
            padding: 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.78rem; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; width: 100%;
        }
       .btn-finish-promo:hover { background: #222; }
       .promo-hint { display: none; margin-top: 10px; }
       .promo-hint.visible { display: block; }
       .promo-hint-inner {
            border: var(--border-thin);
            border-style: dashed;
            padding: 12px 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: var(--bg);
        }
       .search-wrap { position: relative; }
       .search-wrap input {
            width: 100%;
            padding: 14px 16px 14px 42px;
            border: var(--border);
            background: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            color: var(--ink);
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
       .search-wrap input:focus { background: #fff; }
       .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; color: var(--ink); pointer-events: none; }
       .search-results {
            background: var(--paper);
            border: var(--border);
            border-top: none;
            position: absolute; top: 100%; left: 0; right: 0;
            display: none;
            z-index: 50;
            max-height: 340px; overflow-y: auto;
        }
       .search-results.visible { display: block; }
       .search-result-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: var(--border-thin);
            font-size: 0.78rem;
            display: flex; align-items: center; gap: 10px;
            font-family: 'IBM Plex Mono', monospace;
        }
       .search-result-item:hover { background: var(--bg); }
       .search-result-item.aroma-code {
            font-weight: 600; font-size: 0.62rem;
            background: var(--ink); color: var(--bg);
            padding: 3px 6px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
       .search-result-item.aroma-name { font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
       .search-result-item.aroma-meta { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
       .selected-aroma-card {
            display: none;
            margin-top: 12px;
            background: var(--ink);
            color: var(--bg);
            border: var(--border);
            padding: 12px 14px;
            align-items: center; gap: 10px;
            font-family: 'IBM Plex Mono', monospace;
        }
       .selected-aroma-card.visible { display: flex; }
       .selected-aroma-card.aroma-text { flex: 1; }
       .selected-aroma-card.aroma-text strong { display: block; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
       .selected-aroma-card.aroma-text small { color: rgba(237,232,220,0.7); font-size: 0.66rem; display: block; line-height: 1.4; text-transform: uppercase; }
       .remove-aroma {
            background: transparent;
            border: 1px solid var(--bg);
            color: var(--bg);
            cursor: pointer;
            font-size: 0.8rem;
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
        }
       .remove-aroma:hover { background: var(--bg); color: var(--ink); }
       .addon-switch-wrap { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 2px 0; }
       .addon-switch-info { flex: 1; }
       .addon-switch-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; display: block; }
       .addon-switch-desc { font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; color: var(--muted); margin-top: 2px; display: block; text-transform: uppercase; }
       .addon-switch-price { font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 0.85rem; margin-right: 12px; color: var(--ink); }
       .ios-switch { width: 44px; height: 24px; background: var(--paper); border: var(--border); position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
       .ios-switch.on { background: var(--ink); }
       .ios-switch::after { content: ''; width: 16px; height: 16px; background: var(--paper); border: var(--border-thin); position: absolute; top: 2px; left: 2px; transition: transform 0.2s; }
       .ios-switch.on::after { background: var(--bg); transform: translateX(20px); border-color: var(--bg); }
       .qty-control { display: flex; align-items: center; border: var(--border); overflow: hidden; background: var(--paper); }
       .qty-btn { width: 40px; height: 38px; background: none; border: none; border-right: var(--border-thin); font-size: 1rem; color: var(--ink); cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
       .qty-btn:last-child { border-right: none; border-left: var(--border-thin); }
       .qty-btn:hover { background: var(--bg); }
       .qty-display { width: 40px; text-align: center; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 0.9rem; }
       .coupon-wrap { display: flex; gap: 0; align-items: stretch; border: var(--border); }
       .coupon-wrap input {
            flex: 1; padding: 12px 14px;
            border: none; border-right: var(--border);
            background: var(--paper);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem; color: var(--ink);
            outline: none; text-transform: uppercase; letter-spacing: 1.5px;
        }
       .coupon-wrap input::placeholder { text-transform: uppercase; letter-spacing: 0.5px; color: #999; font-size: 0.7rem; }
       .btn-apply-coupon {
            padding: 12px 18px;
            background: var(--ink); color: var(--bg);
            border: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            cursor: pointer;
        }
       .coupon-feedback { margin-top: 10px; padding: 10px 12px; border: var(--border-thin); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; display: none; text-transform: uppercase; }
       .coupon-feedback.success { display: flex; background: var(--bg); color: var(--ink); }
       .coupon-feedback.error { display: flex; background: var(--paper); color: var(--ink); }
       .bottom-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 560px;
            padding: 12px 14px 16px;
            background: var(--paper);
            border-top: var(--border);
            z-index: 90;
            display: flex; align-items: center; gap: 12px;
            backdrop-filter: none;
        }
       .bottom-bar-preview { flex: 1; min-width: 0; }
       .bottom-bar-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
            font-weight: 600;
        }
       .bottom-bar-price {
            font-family: 'Courier Prime', monospace;
            font-size: 1.3rem; font-weight: 700; letter-spacing: 0; color: var(--ink); line-height: 1;
            text-transform: uppercase;
        }
       .btn-add {
            background: var(--ink); color: var(--bg);
            border: var(--border);
            padding: 13px 18px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            cursor: pointer; white-space: nowrap;
        }
       .btn-add:hover { background: #222; }
       .info-btn {
            background: var(--paper);
            border: var(--border-thin);
            width: 20px; height: 20px;
            display: inline-flex; align-items: center; justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.62rem; font-weight: 700;
            color: var(--ink); cursor: pointer;
            line-height: 1; padding: 0;
        }
       .info-btn:hover { background: var(--ink); color: var(--bg); }
       .cart-fab {
            touch-action: manipulation;
            user-select: none;
            position: fixed; top: 108px; right: 14px;
            z-index: 190;
            background: var(--ink); color: var(--bg);
            border: var(--border);
            padding: 10px 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: opacity 0.3s ease; opacity: 0; pointer-events: none;
            box-shadow: none;
        }
       .cart-fab.visible { opacity: 1; pointer-events: auto; }
       .cart-fab-count {
            background: var(--bg); color: var(--ink);
            font-size: 0.62rem; font-weight: 700;
            min-width: 18px; height: 18px;
            border: var(--border-thin);
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
        }
       .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 200; pointer-events: none; transition: background 0.3s ease; }
       .cart-overlay.open { background: rgba(0,0,0,0.4); pointer-events: auto; }
       .cart-drawer {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 420px; max-width: 100vw;
            background: var(--paper);
            z-index: 201;
            display: flex; flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: var(--border);
        }
       .cart-drawer.open { transform: translateX(0); }
       .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px; border-bottom: var(--border); flex-shrink: 0; background: var(--bg); }

       .drawer-item-price { font-family: 'Courier Prime', monospace; font-size: 0.95rem; font-weight: 700; }
       .drawer-remove-btn { background: none; border: var(--border-thin); padding: 4px 8px; font-size: 0.62rem; color: var(--ink); cursor: pointer; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.8px; }
       .drawer-remove-btn:hover { background: var(--ink); color: var(--bg); }
       .drawer-promo-toggle { background: var(--bg); border: var(--border-thin); padding: 8px 10px; font-size: 0.68rem; font-family: 'IBM Plex Mono', monospace; color: var(--ink); cursor: pointer; width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-weight: 600; text-transform: uppercase; }
       .drawer-promo-details { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
       .drawer-promo-details.expanded { max-height: 400px; }
       .drawer-promo-details-inner { padding: 10px; background: var(--bg); border: var(--border-thin); border-top: none; }
       .drawer-promo-badge { display: inline-flex; background: var(--ink); color: var(--bg); font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 3px 7px; margin-bottom: 8px; }
       .drawer-feromonas-badge { display: inline-flex; background: var(--paper); border: var(--border-thin); font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.5px; padding: 3px 8px; margin-top: 4px; text-transform: uppercase; }
       .drawer-footer { border-top: var(--border); padding: 14px 16px 20px; background: var(--bg); flex-shrink: 0; }
       .drawer-totals { margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace; }
       .drawer-total-row { display: flex; justify-content: space-between; font-size: 0.72rem; padding: 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
       .drawer-grand-total { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 0; margin-top: 6px; border-top: var(--border); }
       .drawer-grand-total .label { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
       .drawer-grand-total .amount { font-family: 'Courier Prime', monospace; font-size: 1.5rem; font-weight: 700; }
       .drawer-coupon-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; padding: 8px 10px; background: var(--paper); border: var(--border-thin); font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; text-transform: uppercase; }
       .drawer-coupon-code { font-weight: 700; }
       .drawer-actions { display: flex; flex-direction: column; gap: 8px; }
       .drawer-btn-wa { background: var(--ink); color: var(--bg); border: var(--border); padding: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
       .drawer-btn-clear { background: var(--paper); color: var(--ink); border: var(--border); padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; width: 100%; }
       .shipping-progress { background: var(--paper); border: var(--border-thin); height: 6px; margin-top: 4px; overflow: hidden; }
       .shipping-progress-fill { height: 100%; background: var(--ink); transition: width 0.4s ease; }
       .toast {
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
            background: var(--ink); color: var(--bg);
            padding: 12px 18px;
            border: var(--border);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase;
            opacity: 0; pointer-events: none; transition: all 0.25s ease;
            z-index: 1200;
        }
       .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
       /* Overlays: solo capturan clics cuando están activos */
       .tour-overlay, .promo-guide-overlay, .info-modal-overlay {
            pointer-events: none;
            opacity: 0;
        }
       .tour-overlay.active, .promo-guide-overlay.open, .info-modal-overlay.open {
            pointer-events: auto;
            opacity: 1;
        }
       .tour-highlight { pointer-events: none; }
       .tour-tooltip { pointer-events: none; }
       .tour-tooltip.active { pointer-events: auto; } /* El tooltip del tour sí captura clics para botones */
       .conc-section-hidden { display: none!important; }
       .divider { height: 1px; background: transparent; margin: 8px 0; }
        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            input[type="text"], input[type="search"], textarea, select { font-size: 16px!important; }
        }
    </style>
</head>
<body>
    <div class="announcement-bar" role="marquee">
        <div class="marquee-track">
            <span>ENVIO GRATIS EN CUALQUIER PROMOCION O SUPERANDO $1200 <span class="marquee-sep">/</span></span>
            <span>ALTA CONCENTRACION · LARGA DURACION · ALTA ESTELA <span class="marquee-sep">/</span></span>
            <span>AROMAS INSPIRADOS EN LAS MEJORES CASAS DEL MUNDO <span class="marquee-sep">/</span></span>
            <span>LABORATORIO: DISCOVERY SET 15x12 AROMAS 2ML <span class="marquee-sep">/</span></span>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <!-- Tour (guía) restaurado -->
    <div class="tour-overlay" id="tour-overlay" onclick="tourSkip()"></div>
    <div class="tour-highlight" id="tour-highlight"></div>
    <div class="tour-tooltip" id="tour-tooltip">
        <div class="tour-step-label" id="tour-step-label"></div>
        <div class="tour-title" id="tour-title"></div>
        <div class="tour-body" id="tour-body"></div>
        <div class="tour-footer">
            <div class="tour-dots" id="tour-dots"></div>
            <div class="tour-actions">
                <button type="button" class="tour-btn-skip" onclick="tourSkip()">Omitir</button>
                <button type="button" class="tour-btn-next" id="tour-btn-next" onclick="tourNext()">Siguiente →</button>
            </div>
        </div>
    </div>
    <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
    <aside class="cart-drawer" id="cart-drawer">
        <!-- ... resto del carrito ... -->
    </aside>
    <div class="header">
        <h1>VILLE DU PARFUM</h1>
        <button type="button" class="info-btn unseen" id="info-btn-legal" onclick="openInfoModal('legal')" style="position:absolute; right:16px;">i</button>
        <button type="button" class="info-btn" id="btn-help-tour" onclick="tourStart()" style="position:absolute; right:50px;" title="Guía de uso">?</button>
    </div>
    <!-- resto del contenido -->
    <div class="stepper-grid" id="stepper">
        <!-- stepper -->
    </div>
    <button type="button" class="cart-fab" id="cart-fab" onclick="openCart()">CART <span class="cart-fab-count" id="cart-fab-count">0</span></button>
    <div class="container" id="main-container">
        <!-- tarjetas -->
    </div>
    <!-- modales y scripts -->
    <script>
        // ... Todo el JavaScript anterior, pero con el tour restaurado y funciones reales ...
        const TOUR_STEPS = [
            { anchor: 'tour-anchor-size', title: 'Elige tu presentación', body: 'Desde 2ml para probar hasta 100ml. También Crema y Desodorante.', arrow: 'arrow-top', position: 'below' },
            { anchor: 'card-conc', title: 'Selecciona la concentración', body: '1 punto = EDT ligera. 4 puntos = Extrait máxima intensidad.', arrow: 'arrow-top', position: 'below' },
            { anchor: 'card-promo', title: 'Paquetes especiales', body: 'Elige un paquete y asigna unidades a cada aroma con los botones +/−.', arrow: 'arrow-top', position: 'below' },
            { anchor: 'card-aroma', title: 'Busca tu aroma', body: 'Escribe código, marca o familia olfativa. Selecciónalo del listado.', arrow: 'arrow-top', position: 'below' },
            { anchor: 'card-extras', title: 'Feromonas opcionales', body: 'Actívalas con el switch. Potencia tu perfume por $60 MXN.', arrow: 'arrow-top', position: 'below' },
        ];
        let tourStep=0, tourActive=false;
        function tourStart() {
            if (tourActive) return;
            tourActive = true;
            tourStep = 0;
            tourRender();
        }
        function tourRender() {
            if (!tourActive) return;
            const step = TOUR_STEPS[tourStep];
            const anchor = document.getElementById(step.anchor);
            if (!anchor) return;
            const overlay = document.getElementById('tour-overlay');
            const highlight = document.getElementById('tour-highlight');
            const tooltip = document.getElementById('tour-tooltip');
            overlay.classList.add('active');
            tooltip.classList.remove('active');
            highlight.classList.remove('active');
            anchor.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => {
                const r = anchor.getBoundingClientRect();
                const pad = 8;
                highlight.style.left = (r.left - pad) + 'px';
                highlight.style.top = (r.top - pad) + 'px';
                highlight.style.width = (r.width + pad * 2) + 'px';
                highlight.style.height = (r.height + pad * 2) + 'px';
                highlight.classList.add('active');
                tooltip.className = 'tour-tooltip ' + step.arrow;
                const tw = Math.min(320, window.innerWidth - 40);
                let left = r.left;
                if (left + tw > window.innerWidth - 10) left = window.innerWidth - tw - 10;
                if (left < 10) left = 10;
                tooltip.style.left = left + 'px';
                tooltip.style.width = tw + 'px';
                if (step.position === 'below') {
                    tooltip.style.top = (r.bottom + pad + 14) + 'px';
                    tooltip.style.bottom = 'auto';
                } else {
                    tooltip.style.bottom = (window.innerHeight - r.top + pad + 14) + 'px';
                    tooltip.style.top = 'auto';
                }
                document.getElementById('tour-step-label').textContent = 'Paso ' + (tourStep + 1) + ' de ' + TOUR_STEPS.length;
                document.getElementById('tour-title').textContent = step.title;
                document.getElementById('tour-body').textContent = step.body;
                document.getElementById('tour-dots').innerHTML = TOUR_STEPS.map((_, i) => '<div class="tour-dot ' + (i === tourStep ? 'active' : '') + '"></div>').join('');
                document.getElementById('tour-btn-next').textContent = tourStep === TOUR_STEPS.length - 1 ? '¡Entendido! ✓' : 'Siguiente →';
                tooltip.classList.add('active');
            }, 350);
        }
        function tourNext() {
            tourStep++;
            if (tourStep >= TOUR_STEPS.length) {
                tourEnd();
            } else {
                tourRender();
            }
        }
        function tourSkip() {
            tourEnd();
        }
        function tourEnd() {
            tourActive = false;
            document.getElementById('tour-tooltip').classList.remove('active');
            document.getElementById('tour-highlight').classList.remove('active');
            setTimeout(() => {
                document.getElementById('tour-overlay').classList.remove('active');
                document.getElementById('tour-highlight').style.cssText = 'width:0;height:0;left:-9999px;top:-9999px;';
            }, 320);
            try { localStorage.setItem('aion_tour_done_v2', '1'); } catch (e) {}
        }
        // No se inicia automáticamente; se inicia con el botón "?"
        window.onload = function() {
            syncOptionFromSelectors();
            updateBottomBar();
            updateStepper();
        };
    </script>
</body>
</html>
